                const now = new Date();
                const diff = now - date;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                if (days === 0) return date.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
                if (days === 1) return 'Вчера';
                if (days < 7) return date.toLocaleDateString('ru', { weekday: 'short' });
                return date.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' });
            };
            
            const getInitials = (name) => {
                if (!name) return '?';
                return name.charAt(0).toUpperCase();
            };
            
            const getChatColor = (name) => {
                const colors = [
                    'from-purple-500 to-pink-500',
                    'from-blue-500 to-cyan-500',
                    'from-green-500 to-emerald-500',
                    'from-orange-500 to-red-500',
                    'from-indigo-500 to-purple-500'
                ];
                const index = (name || '').charCodeAt(0) % colors.length;
                return colors[index];
            };
            
            if (selectedChat) {
                const chat = chats.find(c => c.unique_chat_id === selectedChat);
                const peerName = chat?.peer_name || 'Чат';
                const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user || {};
                
                return React.createElement('div', { className: 'h-full flex flex-col' },
                    React.createElement('div', { className: 'glass-strong px-4 py-3 flex items-center gap-3 sticky top-0 z-20' },
                        React.createElement('button', { 
                            onClick: () => { setSelectedChat(null); setMessages([]); }, 
                            className: 'p-2 rounded-full hover:bg-white/10 transition-colors' 
                        }, Icon({ name: 'back', className: 'w-5 h-5' })),
                        React.createElement('div', { className: `w-10 h-10 rounded-full bg-gradient-to-br ${getChatColor(peerName)} flex items-center justify-center font-bold text-sm` }, getInitials(peerName)),
                        React.createElement('div', { className: 'flex-1 min-w-0' },
                            React.createElement('div', { className: 'font-semibold text-sm truncate' }, peerName),
                            React.createElement('div', { className: 'text-xs text-white/50' }, messages.length + ' сообщений')
                        )
                    ),
                    React.createElement('div', { className: 'flex-1 overflow-y-auto px-4 py-4 space-y-2' },
                        loading && messages.length === 0 ? 
                            React.createElement('div', { className: 'flex justify-center py-8' },
                                React.createElement('div', { className: 'w-8 h-8 border-2 border-purple-500 border-t-transparent rounded-full animate-spin' })
                            ) :
                        messages.length === 0 ?
                            React.createElement('div', { className: 'text-center py-8 text-white/50 text-sm' }, 'Нет сообщений') :
                        messages.map((msg, idx) => {
                            const isMine = msg.from_user_id === tg.id;
                            return React.createElement('div', {
                                key: msg.message_id || idx,
                                className: 'flex ' + (isMine ? 'justify-end' : 'justify-start') + ' message-bubble'
                            },
                                React.createElement('div', {
                                    className: 'max-w-[80%] px-4 py-2.5 rounded-2xl text-sm ' + 
                                        (isMine ? 'gradient-bg text-white' : 'glass') +
                                        (isMine ? ' rounded-br-md' : ' rounded-bl-md')
                                },
                                    React.createElement('div', null, msg.content || '[' + (msg.content_type || 'text') + ']'),
                                    React.createElement('div', { className: 'text-[10px] mt-1 ' + (isMine ? 'text-white/70' : 'text-white/50') + ' text-right' },
                                        formatTime(msg.created_at)
                                    )
                                )
                            );
                        }),
                        React.createElement('div', { ref: messagesEndRef })
                    )
                );
            }
            
            return React.createElement('div', { className: 'px-4 pt-4 pb-32' },
                React.createElement('h1', { className: 'text-3xl font-bold mb-4 gradient-text' }, 'Ваши чаты'),
                React.createElement('div', { className: 'glass p-3 flex items-center gap-3 mb-4' },
                    Icon({ name: 'search', className: 'w-5 h-5 text-white/50' }),
                    React.createElement('input', {
                        type: 'text',
                        placeholder: 'Поиск чатов...',
                        value: searchQuery,
                        onChange: (e) => setSearchQuery(e.target.value),
                        className: 'flex-1 bg-transparent outline-none text-sm placeholder-white/40'
                    })
                ),
                loading ?
                    React.createElement('div', { className: 'flex justify-center py-12' },
                        React.createElement('div', { className: 'w-10 h-10 border-3 border-purple-500 border-t-transparent rounded-full animate-spin' })
                    ) :
                filteredChats.length === 0 ?
                    React.createElement('div', { className: 'text-center py-12' },
                        React.createElement('div', { className: 'text-5xl mb-3' }, ''),
                        React.createElement('div', { className: 'text-white/60 text-sm' }, searchQuery ? 'Чаты не найдены' : 'У вас пока нет чатов'),
                        React.createElement('div', { className: 'text-white/40 text-xs mt-1' }, 'Начните общение с ботом')
                    ) :
                React.createElement('div', { className: 'space-y-2' },
                    filteredChats.map(chat => React.createElement('div', {
                        key: chat.unique_chat_id,
                        onClick: () => setSelectedChat(chat.unique_chat_id),
                        className: 'glass p-3 flex items-center gap-3 cursor-pointer chat-item'
                    },
                        React.createElement('div', { className: `w-12 h-12 rounded-full bg-gradient-to-br ${getChatColor(chat.peer_name)} flex items-center justify-center font-bold text-lg flex-shrink-0` }, getInitials(chat.peer_name)),
                        React.createElement('div', { className: 'flex-1 min-w-0' },
                            React.createElement('div', { className: 'flex items-center justify-between' },
                                React.createElement('div', { className: 'font-semibold text-sm truncate' }, chat.peer_name || 'Неизвестный чат'),
                                React.createElement('div', { className: 'text-xs text-white/40 ml-2 flex-shrink-0' }, formatTime(chat.last_message_at))
                            ),
                            React.createElement('div', { className: 'text-xs text-white/50 truncate mt-0.5' }, chat.last_message || 'Нет сообщений')
                        ),
                        chat.unread_count > 0 ?
                            React.createElement('div', { className: 'w-5 h-5 rounded-full gradient-bg flex items-center justify-center text-xs font-bold flex-shrink-0' }, chat.unread_count) :
                        null
                    ))
                )
            );
        }
        
        function SettingsPage() {
            const [settings, setSettings] = useState({ theme: 'dark', notifications: true, language: 'ru' });
            const [saved, setSaved] = useState(false);
            
            useEffect(() => {
                api.settings.get().then(data => {
                    if (data) {
                        setSettings(data);
                        applyTheme(data.theme || 'dark');
                    }
                }).catch(() => {
                    const saved = localStorage.getItem('delixor_settings');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        setSettings(parsed);
                        applyTheme(parsed.theme || 'dark');
                    }
                });
            }, []);
            
            const applyTheme = (theme) => {
                if (theme === 'light') {
                    document.body.classList.add('light-theme');
                } else {
                    document.body.classList.remove('light-theme');
                }
            };
            
            const update = (patch) => {
                const next = { ...settings, ...patch };
                setSettings(next);
                applyTheme(next.theme);
                localStorage.setItem('delixor_settings', JSON.stringify(next));
                api.settings.save(next).then(() => {
                    setSaved(true);
                    setTimeout(() => setSaved(false), 1500);
                }).catch(() => {});
            };
            
            const isLight = settings.theme === 'light';
            
            return React.createElement('div', { className: 'px-4 pt-4 space-y-4 pb-32' },
                React.createElement('h1', { className: 'text-3xl font-bold gradient-text' }, 'Настройки'),
                saved && React.createElement('div', { className: 'fixed top-4 left-1/2 -translate-x-1/2 glass px-4 py-2 text-sm text-green-400 z-50' }, '✓ Сохранено'),
                
                React.createElement('div', { className: 'glass p-5' },
                    React.createElement('div', { className: 'flex items-center justify-between mb-4' },
                        React.createElement('div', null,
                            React.createElement('div', { className: 'font-semibold text-sm' }, 'Тема оформления'),
                            React.createElement('div', { className: 'text-xs text-white/50 mt-0.5' }, 'Выберите внешний вид приложения')
                        ),
                        React.createElement('div', { className: 'flex items-center gap-2 text-xs' },
                            React.createElement('span', { className: !isLight ? 'text-white' : 'text-white/50' }, '🌙'),
                            React.createElement('span', { className: isLight ? 'text-white' : 'text-white/50' }, '️')
                        )
                    ),
                    React.createElement('div', { className: 'grid grid-cols-2 gap-2' },
                        React.createElement('button', { 
                            onClick: () => update({ theme: 'dark' }), 
                            className: 'py-3 rounded-2xl transition-all ' + (!isLight ? 'gradient-bg text-white shadow-lg' : 'bg-white/5 text-white/70') 
                        }, 
                            React.createElement('div', { className: 'flex flex-col items-center gap-1' },
                                React.createElement('span', { className: 'text-xl' }, ''),
                                React.createElement('span', { className: 'text-sm font-medium' }, 'Тёмная')
                            )
                        ),
                        React.createElement('button', { 
                            onClick: () => update({ theme: 'light' }), 
                            className: 'py-3 rounded-2xl transition-all ' + (isLight ? 'gradient-bg text-white shadow-lg' : 'bg-white/5 text-white/70') 
                        }, 
                            React.createElement('div', { className: 'flex flex-col items-center gap-1' },
                                React.createElement('span', { className: 'text-xl' }, '☀️'),
                                React.createElement('span', { className: 'text-sm font-medium' }, 'Светлая')
                            )
                        )
                    )
                ),
                
                React.createElement('div', { className: 'glass p-5 flex items-center justify-between' },
                    React.createElement('div', null,
                        React.createElement('div', { className: 'font-semibold text-sm' }, 'Уведомления'),
                        React.createElement('div', { className: 'text-xs text-white/50 mt-0.5' }, 'Получать уведомления о новых сообщениях')
                    ),
                    React.createElement('button', {
                        onClick: () => update({ notifications: !settings.notifications }),
                        className: 'w-14 h-8 rounded-full relative transition-colors ' + (settings.notifications ? 'gradient-bg' : 'bg-white/10')
                    }, 
                        React.createElement('div', { 
                            className: 'absolute top-1 w-6 h-6 rounded-full bg-white shadow-md transition-all duration-300 ' + (settings.notifications ? 'left-7' : 'left-1') 
                        })
                    )
                ),
                
                React.createElement('div', { className: 'glass p-5' },
                    React.createElement('div', { className: 'font-semibold text-sm mb-3' }, 'Язык'),
                    React.createElement('div', { className: 'grid grid-cols-2 gap-2' },
                        React.createElement('button', { 
                            onClick: () => update({ language: 'ru' }), 
                            className: 'py-3 rounded-2xl transition-all ' + (settings.language === 'ru' ? 'gradient-bg text-white shadow-lg' : 'bg-white/5 text-white/70') 
                        }, '🇷🇺 Русский'),
                        React.createElement('button', { 
                            onClick: () => update({ language: 'en' }), 
                            className: 'py-3 rounded-2xl transition-all ' + (settings.language === 'en' ? 'gradient-bg text-white shadow-lg' : 'bg-white/5 text-white/70') 
                        }, '🇬🇧 English')
                    )
                ),
                
                React.createElement('div', { className: 'glass p-5' },
                    React.createElement('div', { className: 'font-semibold text-sm mb-1' }, 'О приложении'),
                    React.createElement('div', { className: 'text-xs text-white/50' }, 'DelixorMod v1.0.0'),
                    React.createElement('div', { className: 'text-xs text-white/40 mt-1' }, '© 2026 DelixorMod. Все права защищены.')
                ),
                
                React.createElement('div', { className: 'glass p-5 cursor-pointer active:scale-95 transition-transform', onClick: () => { if(confirm('Очистить историю чатов? Это действие нельзя отменить.')) alert('История очищена'); } },
                    React.createElement('div', { className: 'flex items-center gap-3' },
                        React.createElement('div', { className: 'text-red-400' }, Icon({ name: 'trash', className: 'w-5 h-5' })),
                        React.createElement('div', { className: 'text-red-400 font-medium text-sm' }, 'Очистить историю чатов')
                    )
                )
            );
        }
        
        function DelPNPage() {
            const [data, setData] = useState(null);
            useEffect(() => { api.delpn.get().then(setData).catch(() => {}); }, []);
            return React.createElement('div', { className: 'px-4 pt-4 space-y-4 pb-32' },
                React.createElement('div', { className: 'glass p-6 relative overflow-hidden' },
                    React.createElement('div', { className: 'relative' },
                        React.createElement('div', { className: 'w-16 h-16 rounded-3xl gradient-bg flex items-center justify-center mb-4 neon-glow text-3xl' }, '🛡️'),
                        React.createElement('h1', { className: 'text-3xl font-bold gradient-text' }, 'DelPN'),
                        React.createElement('p', { className: 'text-white/70 mt-2 text-sm' }, data && data.description || 'Защищённый VPN для безопасного интернета'),
                        React.createElement('div', { className: 'mt-4 inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-sm ' + (data && data.is_connected ? 'bg-green-500/20 text-green-400' : 'bg-white/10 text-white/60') },
                            React.createElement('div', { className: 'w-2 h-2 rounded-full ' + (data && data.is_connected ? 'bg-green-400' : 'bg-white/40') }),
                            React.createElement('span', null, data && data.status || 'Не подключено')
                        )
                    )
                ),
                React.createElement('div', { className: 'glass p-5' },
                    React.createElement('div', { className: 'text-sm text-white/60 mb-3 font-semibold' }, 'Возможности'),
                    React.createElement('div', { className: 'space-y-3' },
                        (data && data.features || ['Шифрование трафика', 'Анонимность в сети', 'Обход блокировок', 'Высокая скорость']).map((f, i) => React.createElement('div', { key: i, className: 'flex items-center gap-3' },
                            React.createElement('div', { className: 'w-6 h-6 rounded-full gradient-bg flex items-center justify-center text-xs flex-shrink-0' }, '✓'),
                            React.createElement('span', { className: 'text-sm' }, f)
                        ))
                    )
                ),
                React.createElement('div', { className: 'glass gradient-bg p-5 flex items-center justify-between' },
                    React.createElement('div', null,
                        React.createElement('div', { className: 'text-xs opacity-80' }, 'Тариф'),
                        React.createElement('div', { className: 'text-2xl font-bold' }, data && data.tariff || '299 руб/мес')
                    ),
                    React.createElement('button', {
                        onClick: () => { if (data && data.connect_url) window.open(data.connect_url); },
                        className: 'bg-white text-[#7C4DFF] px-6 py-3 rounded-2xl font-semibold text-sm'
                    }, 'Подключить')
                )
            );
        }
        
        function App() {
            const [page, setPage] = useState('menu');
            useEffect(() => {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                }
                const saved = localStorage.getItem('delixor_settings');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.theme === 'light') {
                        document.body.classList.add('light-theme');
                    }
                }
            }, []);
            return React.createElement('div', { className: 'h-screen w-full overflow-hidden relative' },
                React.createElement('main', { className: 'h-full w-full overflow-y-auto overflow-x-hidden' },
                    page === 'menu' && React.createElement(MenuPage),
                    page === 'chats' && React.createElement(ChatsPage),
                    page === 'settings' && React.createElement(SettingsPage),
                    page === 'delpn' && React.createElement(DelPNPage)
                ),
                React.createElement(BottomNav, { page: page, setPage: setPage })
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
